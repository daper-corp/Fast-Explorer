# Runs on every PR and push to main. shell-host tests need an interactive Explorer session, so they are skipped here.
name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets
      - run: cargo test -p fex-core
      - run: cargo test -p fex
